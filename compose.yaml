
services:
  api:
    build:
      context: .
      dockerfile: dockerfile

    container_name: netsol-api

    command: >
      uv run --no-sync uvicorn
      netsol.app:app
      --host 0.0.0.0
      --port 8000
      --reload

    ports:
      - "8000:8000"

    volumes:
      - ./src:/app/src

    env_file:
      - .env
