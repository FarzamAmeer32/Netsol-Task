
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_NAME: ${APP_NAME:-Python API Starter}
      APP_VERSION: ${APP_VERSION:-0.1.0}
    volumes:
      - ./src:/app/src
    command: uv run uvicorn python_api_starter.main:app --host 0.0.0.0 --port 8000 --reload --app-dir src
