[project]
name = "netsol"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Farzam Ameer", email = "farzamameer638@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.157.0",
    "google-genai>=2.33.0",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
netsol = "netsol:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
]
